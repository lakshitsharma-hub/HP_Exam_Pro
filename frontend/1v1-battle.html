<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1v1 Battle Arena - HP Exam Pro</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800;900&family=JetBrains+Mono:wght@700;800&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: #030712; color: #f8fafc;
            font-family: 'Plus Jakarta Sans', sans-serif;
            height: 100vh; width: 100vw;
            display: flex; flex-direction: column; overflow: hidden;
            background-image: radial-gradient(circle at center, #0f172a 0%, #030712 100%);
        }

        /* 📱 LOBBY VIEW */
        #lobby-view { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .lobby-card {
            background: rgba(15, 23, 42, 0.95); border: 1px solid #334155; border-radius: 24px; 
            padding: 40px; max-width: 520px; width: 100%; text-align: center; 
            box-shadow: 0 25px 60px rgba(0,0,0,0.8); position: relative;
        }
        .btn-close {
            position: absolute; top: 20px; right: 25px; background: transparent; 
            border: none; color: #ef4444; font-size: 24px; cursor: pointer; transition: 0.2s;
        }
        .btn-close:hover { transform: scale(1.1); text-shadow: 0 0 10px #ef4444; }

        .room-code-box { background: #020617; border: 2px dashed #38bdf8; border-radius: 16px; padding: 20px; margin: 25px 0; }

        /* ⚔️ BATTLE HUD */
        .battle-hud {
            width: 100%; display: none; align-items: center; justify-content: space-between;
            background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(12px);
            border-bottom: 1px solid #1e293b; padding: 16px 40px; z-index: 10;
        }
        .hud-player { display: flex; align-items: center; gap: 16px; width: 38%; }
        .hud-player.opponent { flex-direction: row-reverse; text-align: right; }
        .hud-avatar-wrapper { position: relative; width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .hud-avatar { width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 26px; background: #0b0f19; z-index: 2; }
        
        .god-hud-aura { border: 2px solid #facc15; animation: godMakerPulse 2s infinite alternate, goldFlash 4s infinite; }
        .god-hud-aura::before { content: ''; position: absolute; top: -6px; left: -6px; right: -6px; bottom: -6px; border-radius: 50%; border-top: 2px solid #22c55e; border-bottom: 2px solid #22c55e; animation: spin 3s linear infinite; }
        .god-hud-aura::after { content: ''; position: absolute; top: -10px; left: -10px; right: -10px; bottom: -10px; border-radius: 50%; border-left: 2px dashed #facc15; border-right: 2px dashed #facc15; animation: spin 5s linear infinite reverse; }
        
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes godMakerPulse { 0% { box-shadow: 0 0 15px #eab308, inset 0 0 10px #ca8a04; } 100% { box-shadow: 0 0 35px #fde047, inset 0 0 20px #facc15; transform: scale(1.04); } }
        @keyframes goldFlash { 0%, 93%, 97%, 100% {} 94%, 96% { box-shadow: 0 0 80px #fff, 0 0 140px #fef08a; background: #fff; border-color: #fff; } }
        .opp-hud-aura { border: 2px solid #ef4444; box-shadow: 0 0 20px rgba(239, 68, 68, 0.6); }

        .matrix-particle { position: absolute; color: #22c55e; font-family: monospace; font-weight: 900; font-size: 15px; pointer-events: none; text-shadow: 0 0 8px #22c55e; z-index: 1; animation: flyMatrix 1.5s ease-out forwards; }
        @keyframes flyMatrix { 0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; } 100% { transform: translate(var(--tx), var(--ty)) scale(1.3); opacity: 0; } }

        .hud-info { width: 100%; }
        .hud-meta-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .progress-track { width: 100%; height: 12px; background: #111827; border-radius: 6px; overflow: hidden; border: 1px solid #1f2937; }
        .progress-bar-god { height: 100%; width: 0%; background: linear-gradient(90deg, #ca8a04, #facc15, #fef08a); box-shadow: 0 0 15px #facc15; transition: width 0.4s; }
        .progress-bar-opp { height: 100%; width: 0%; background: linear-gradient(90deg, #991b1b, #ef4444, #f87171); box-shadow: 0 0 15px #ef4444; transition: width 0.4s; }

        .hud-center { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 140px; gap: 6px; }
        .timer-circle { width: 48px; height: 48px; border-radius: 50%; background: #020617; border: 2px solid #38bdf8; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 19px; color: #38bdf8; box-shadow: 0 0 15px rgba(56, 189, 248, 0.4); }

        /* 🎯 ARENA & QUESTIONS */
        .arena-body { flex: 1; display: none; align-items: center; justify-content: center; padding: 20px 40px; position: relative; }
        .question-card { width: 100%; max-width: 960px; background: rgba(15, 23, 42, 0.95); border: 1px solid #1e293b; border-radius: 20px; padding: 40px; position: relative; overflow: hidden;}
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
        .opt-btn { background: #111827; border: 2px solid #1f2937; border-radius: 14px; padding: 20px 24px; color: #e2e8f0; font-size: 16px; font-weight: 700; text-align: left; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: space-between; }
        .opt-btn:hover:not(.disabled) { border-color: #38bdf8; background: #1e293b; transform: translateY(-2px); }
        .opt-btn.correct { background: rgba(34, 197, 94, 0.15) !important; border-color: #22c55e !important; color: #4ade80 !important; }
        .opt-btn.wrong { background: rgba(239, 68, 68, 0.15) !important; border-color: #ef4444 !important; color: #f87171 !important; }

        /* ⚡ REALITY OVERRIDE */
        #reality-override { display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(2, 6, 23, 0.95); flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px; z-index: 30; border: 2px solid #facc15; animation: overrideGlitch 0.2s infinite alternate; }
        @keyframes overrideGlitch { 0% { transform: translate(0); } 100% { transform: translate(-2px, 1px); } }

        /* ACTION BUTTONS */
        .action-btn { border-radius: 12px; padding: 16px; font-size: 16px; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; border: none; width: 100%; transition: 0.2s; }
        .action-btn:hover { transform: translateY(-2px); }
    </style>
</head>
<body>

    <!-- 📱 1. LOBBY VIEW -->
    <div id="lobby-view">
        <div class="lobby-card">
            <button onclick="window.location.href='index.html'" class="btn-close" title="Exit"><i class="fa-solid fa-right-from-bracket"></i></button>

            <i class="fa-solid fa-gamepad" style="font-size: 45px; color: #38bdf8; margin-bottom: 15px;"></i>
            <h2 style="font-size: 26px; font-weight: 900; color: #38bdf8; margin-bottom: 10px; text-transform: uppercase;">1v1 Battle Arena</h2>
            
            <div class="room-code-box">
                <span style="font-size: 12px; color: #94a3b8; font-weight: 800;">YOUR BATTLE ROOM CODE</span>
                <div id="room-code" style="font-family: monospace; font-size: 36px; font-weight: 900; color: #facc15; letter-spacing: 6px;">---</div>
            </div>

            <div style="display: flex; flex-direction: column; gap: 12px; width: 100%;">
                <button type="button" onclick="shareOnWhatsApp()" class="action-btn" style="background: #22c55e; color: white;">
                    <i class="fa-brands fa-whatsapp" style="font-size: 22px;"></i> Invite Friend on WhatsApp
                </button>
                
                <div style="display: flex; align-items: center; gap: 15px; margin: 5px 0;">
                    <div style="height: 1px; background: #334155; flex: 1;"></div>
                    <span style="color: #64748b; font-size: 12px; font-weight: bold;">OR</span>
                    <div style="height: 1px; background: #334155; flex: 1;"></div>
                </div>

                <button type="button" id="find-opp-btn" onclick="startMatchmaking()" class="action-btn" style="background: linear-gradient(90deg, #2563eb, #38bdf8); color: white;">
                    <i class="fa-solid fa-bolt"></i> Find Random Opponent
                </button>
            </div>
        </div>
    </div>

    <!-- ⚔️ 2. MATCH HUD -->
    <div class="battle-hud" id="match-hud">
        <div class="hud-player">
            <div class="hud-avatar-wrapper" id="god-avatar-wrapper"><div class="hud-avatar god-hud-aura">🪐</div></div>
            <div class="hud-info">
                <div class="hud-meta-row">
                    <div class="hud-name" id="user-display-name" style="color: #fef08a;">THE GOD MAKER 👑</div>
                    <div id="user-xp-tag" style="font-size:11px; font-weight:bold; color:#facc15;">XP: ∞</div>
                </div>
                <div class="progress-track"><div id="god-progress" class="progress-bar-god"></div></div>
            </div>
        </div>
        <div class="hud-center">
            <div id="timer-box" class="timer-circle">10</div>
            <div id="round-label" style="font-size: 11px; color: #94a3b8; font-weight: 800; margin-top:5px;">Q 1/5</div>
        </div>
        <div class="hud-player opponent">
            <div class="hud-avatar-wrapper"><div class="hud-avatar opp-hud-aura">🔥</div></div>
            <div class="hud-info">
                <div class="hud-meta-row" style="flex-direction: row-reverse;"><div class="hud-name" id="opp-name" style="color: #f87171;">Searching...</div><div id="opp-rank" style="font-size:11px; font-weight:bold; color:#fca5a5;">--</div></div>
                <div class="progress-track"><div id="opp-progress" class="progress-bar-opp"></div></div>
            </div>
        </div>
    </div>

    <!-- 🎯 3. MATCH ARENA -->
    <div class="arena-body" id="match-arena">
        <div class="question-card">
            <div id="reality-override">
                <div style="color: #facc15; font-size: 24px; font-weight: 900; margin-bottom: 15px;"><i class="fa-solid fa-triangle-exclamation"></i> REALITY REWRITTEN BY THE GOD MAKER</div>
                <div style="font-family: monospace; color: #22c55e; font-size: 14px;">&gt; [SYSTEM PROTOCOL 0x00_OVERRIDE_SUCCESSFUL]<br><span style="color: #facc15;">&gt; TIMELINE RECONFIGURED TO ABSOLUTE TRUTH.</span></div>
            </div>
            <div id="q-text" style="font-size: 22px; font-weight: 800; margin-bottom: 35px; color: #f8fafc;">Loading battle...</div>
            <div class="options-grid" id="options-container"></div>
        </div>
    </div>

    <!-- ⚙️ SCRIPT -->
    <script>
        // 1. Generate Room Code Immediately
        const currentRoomCode = "HP-" + Math.floor(100000 + Math.random() * 900000);
        
        let currentUser = null, userStats = null;
        let matchQuestions = [
            { q: "हिमाचल प्रदेश का राज्य पक्षी कौन सा है?", opts: ["मोनाल", "पश्चिमी ट्रेगोपैन (जजुराना)", "चीड़ तीतर", "पहाड़ी कबूतर"], correct: 1 },
            { q: "सतलुज नदी किस स्थान पर हिमाचल प्रदेश में प्रवेश करती है?", opts: ["तांदी", "शिपकी-ला", "तात्तापानी", "मिरथल"], correct: 1 },
            { q: "पोंग बांध का निर्माण किस नदी पर किया गया है?", opts: ["व्यास", "रावी", "चिनाब", "यमुना"], correct: 0 },
            { q: "हिमाचल प्रदेश की सबसे बड़ी प्राकृतिक झील कौन सी है?", opts: ["रेणुका झील", "रिवालसर झील", "खजियार झील", "पाराशर झील"], correct: 0 },
            { q: "रोहतांग दर्रा किस जिले में स्थित है?", opts: ["किन्नौर", "कुल्लू", "लाहौल-स्पीति", "चंबा"], correct: 1 }
        ];
        
        let qIdx = 0, time = 10, timer = null, myScore = 0, oppScore = 0;
        let isBotMatch = false;
        let supabaseClient = null;

        // 2. Safe Supabase Connection
        try {
            if (window.supabase && typeof window.supabase.createClient === 'function') {
                supabaseClient = window.supabase.createClient(
                    'https://jitkmfqxojfppnpoxeff.supabase.co',
                    'sb_publishable_6H4ld2wexzzNexqTfOtvIw_xLkWKsif'
                );
            }
        } catch (e) {
            console.warn("Supabase init error handled:", e);
        }

        // 3. Bind UI Updates Instantly
        function renderRoomCode() {
            const el = document.getElementById('room-code');
            if (el) el.innerText = currentRoomCode;
        }

        // 4. WhatsApp Share Function
        window.shareOnWhatsApp = function() {
            const inviteUrl = "https://hp-exam-pro.vercel.app/1v1-battle.html?room=" + currentRoomCode;
            const text = "⚔️ *1v1 HP GK BATTLE CHALLENGE!*\n\nRoom Code: " + currentRoomCode + "\nAccept Duel: " + inviteUrl;
            const waUrl = "https://api.whatsapp.com/send?text=" + encodeURIComponent(text);
            window.open(waUrl, '_blank');
        };

        // 5. Matchmaking (10-Second Wait -> Bot)
        window.startMatchmaking = function() {
            const btn = document.getElementById('find-opp-btn');
            if (!btn) return;
            let timeLeft = 10;
            btn.disabled = true;
            btn.style.background = "#eab308";

            const searchInterval = setInterval(() => {
                btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Searching Player... (${timeLeft}s)`;
                timeLeft--;

                if (timeLeft < 0) {
                    clearInterval(searchInterval);
                    startBotMatch();
                }
            }, 1000);
        };

        function startBotMatch() {
            isBotMatch = true;
            document.getElementById('lobby-view').style.display = 'none';
            document.getElementById('match-hud').style.display = 'flex';
            document.getElementById('match-arena').style.display = 'flex';

            const botNames = ["Rohit Sharma", "Priya Thakur", "Aman Verma", "Neha Rajput", "Sahil Rana"];
            const botRanks = ["Pro Challenger (850 XP)", "Elite Scholar (2,100 XP)", "State Conqueror (4,200 XP)"];
            document.getElementById('opp-name').innerText = botNames[Math.floor(Math.random() * botNames.length)];
            document.getElementById('opp-rank').innerText = botRanks[Math.floor(Math.random() * botRanks.length)];

            startGodMatrix();
            loadQuestion();
        }

        function startGodMatrix() {
            setInterval(() => {
                const p = document.createElement('div');
                p.className = 'matrix-particle';
                p.innerText = Math.random() > 0.5 ? '1' : '0';
                p.style.left = '50%';
                p.style.top = '50%';
                const a = Math.random() * Math.PI * 2;
                const d = 40 + Math.random() * 60;
                p.style.setProperty('--tx', Math.cos(a) * d + 'px');
                p.style.setProperty('--ty', Math.sin(a) * d + 'px');
                
                const box = document.getElementById('god-avatar-wrapper');
                if (box) box.appendChild(p);
                setTimeout(() => p.remove(), 1400);
            }, 100);
        }

        // 6. Question Engine
        function loadQuestion() {
            if (qIdx >= matchQuestions.length) {
                concludeMatch();
                return;
            }
            const q = matchQuestions[qIdx];
            document.getElementById('q-text').innerText = `${qIdx + 1}. ${q.q}`;
            document.getElementById('round-label').innerText = `Q ${qIdx + 1}/${matchQuestions.length}`;

            const optsBox = document.getElementById('options-container');
            optsBox.innerHTML = "";

            q.opts.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = "opt-btn";
                btn.innerHTML = `<span>${opt}</span><i class="fa-regular fa-circle"></i>`;
                btn.onclick = () => selectOpt(i, q.correct, btn);
                optsBox.appendChild(btn);
            });

            time = 10;
            const timerBox = document.getElementById('timer-box');
            timerBox.innerText = time;
            timerBox.style.color = "#38bdf8";
            clearInterval(timer);

            timer = setInterval(() => {
                time--;
                timerBox.innerText = time;
                if (time <= 3) timerBox.style.color = "#ef4444";
                if (time <= 0) {
                    clearInterval(timer);
                    qIdx++;
                    loadQuestion();
                }
            }, 1000);

            if (isBotMatch) {
                setTimeout(() => {
                    if (Math.random() > 0.35 && oppScore < matchQuestions.length) {
                        oppScore++;
                        document.getElementById('opp-progress').style.width = `${(oppScore / matchQuestions.length) * 100}%`;
                    }
                }, (2.5 + Math.random() * 3) * 1000);
            }
        }

        // 7. Select & Override
        function selectOpt(sel, cor, btn) {
            clearInterval(timer);
            document.querySelectorAll('.opt-btn').forEach(b => b.classList.add('disabled'));

            if (sel === cor) {
                btn.classList.add('correct');
                btn.querySelector('i').className = "fa-solid fa-circle-check";
                myScore++;
                document.getElementById('god-progress').style.width = `${(myScore / matchQuestions.length) * 100}%`;
                setTimeout(() => { qIdx++; loadQuestion(); }, 1200);
            } else {
                btn.classList.add('wrong');
                document.getElementById('reality-override').style.display = "flex";
                setTimeout(() => {
                    document.getElementById('reality-override').style.display = "none";
                    btn.classList.remove('wrong');
                    btn.classList.add('correct');
                    btn.querySelector('i').className = "fa-solid fa-circle-check";
                    myScore++;
                    document.getElementById('god-progress').style.width = `${(myScore / matchQuestions.length) * 100}%`;
                    setTimeout(() => { qIdx++; loadQuestion(); }, 1200);
                }, 1800);
            }
        }

        // 8. Conclude & XP Save
        async function concludeMatch() {
            clearInterval(timer);
            const won = myScore >= oppScore;

            if (supabaseClient && currentUser && won) {
                try {
                    const newTotalXp = (userStats?.xp || 0) + 50;
                    let newRank = 'Rookie';
                    if (newTotalXp >= 10000) newRank = 'THE GOD MODE';
                    else if (newTotalXp >= 3000) newRank = 'State Conqueror';
                    else if (newTotalXp >= 1500) newRank = 'Elite Scholar';
                    else if (newTotalXp >= 500) newRank = 'Pro Challenger';

                    await supabaseClient.from('user_battle_stats').update({
                        xp: newTotalXp,
                        aura_rank: newRank,
                        battles_won: (userStats?.battles_won || 0) + 1,
                        updated_at: new Date()
                    }).eq('user_id', currentUser.id);
                } catch(e) {
                    console.error("XP update error:", e);
                }
            }

            document.getElementById('q-text').innerHTML = `
                <div style="text-align:center">
                    <h1 style="color:#facc15; font-size:30px; margin-bottom:10px;">🏆 MATCH CONCLUDED</h1>
                    <p style="color:#94a3b8; font-size:16px;">THE GOD MAKER REIGNS SUPREME. ${won ? '<br><span style="color:#22c55e; font-weight:bold;">+50 XP Saved to Supabase!</span>' : ''}</p>
                    <button onclick="window.location.href='index.html'" class="action-btn" style="margin:25px auto 0 auto; max-width:240px; background:#2563eb; color:white;">Exit to Workspace</button>
                </div>`;
            document.getElementById('options-container').innerHTML = "";
        }

        // 9. Background DB Sync (Does not block UI)
        async function loadSupabaseData() {
            if (!supabaseClient) return;
            try {
                const { data: { user } } = await supabaseClient.auth.getUser();
                if (user) {
                    currentUser = user;
                    let { data: stats } = await supabaseClient.from('user_battle_stats').select('*').eq('user_id', user.id).maybeSingle();
                    if (stats) {
                        userStats = stats;
                        const nameEl = document.getElementById('user-display-name');
                        const xpEl = document.getElementById('user-xp-tag');
                        if (nameEl) nameEl.innerText = (userStats.display_name || 'PLAYER').toUpperCase() + ' 👑';
                        if (xpEl) xpEl.innerText = `${userStats.aura_rank || 'Rookie'} (${userStats.xp || 0} XP)`;
                    }
                }
                const { data: qData } = await supabaseClient.from('questions').select('*').limit(5);
                if (qData && qData.length > 0) {
                    matchQuestions = qData.map(item => ({
                        q: item.question_text || item.question || item.q,
                        opts: [item.option_a, item.option_b, item.option_c, item.option_d],
                        correct: (item.correct_option === 'b' || item.correct_answer === 'b') ? 1 : 
                                 (item.correct_option === 'c' || item.correct_answer === 'c') ? 2 : 
                                 (item.correct_option === 'd' || item.correct_answer === 'd') ? 3 : 0
                    }));
                }
            } catch(err) {
                console.warn("Async Supabase sync error:", err);
            }
        }

        // Execute immediately
        renderRoomCode();
        loadSupabaseData();
    </script>
</body>
</html>
