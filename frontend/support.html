<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HP Exam Pro | Support & Free Pro Access</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: #0b1329;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .support-card {
            background: #0f172a;
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 16px;
            max-width: 480px;
            width: 100%;
            padding: 32px 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        .header h2 {
            color: #38bdf8;
            font-size: 22px;
            margin-bottom: 6px;
        }
        .header p {
            color: #94a3b8;
            font-size: 13.5px;
            line-height: 1.5;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 6px;
            font-weight: 600;
        }
        input, select, textarea {
            width: 100%;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px 14px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        select option {
            background: #0f172a;
            color: #fff;
        }
        .btn-submit {
            width: 100%;
            background: #2563eb;
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }
        .btn-submit:hover {
            background: #1d4ed8;
        }
        .btn-submit:disabled {
            background: #475569;
            cursor: not-allowed;
        }
        #status-msg {
            margin-top: 16px;
            font-size: 13.5px;
            text-align: center;
            display: none;
            padding: 10px;
            border-radius: 6px;
            line-height: 1.4;
        }
        .status-success {
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }
        .status-error {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #64748b;
            text-decoration: none;
        }
        .back-link:hover {
            color: #94a3b8;
        }
    </style>
</head>
<body>

<div class="support-card">
    <div class="header">
        <h2>HP Exam Pro Support & Claims</h2>
        <p>Submit your details for doubt assistance or to request sponsored Free Pro Access.</p>
    </div>
    
    <form id="supportForm" onsubmit="submitSupportQuery(event)">
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" required placeholder="Enter your full name">
        </div>
        
        <div class="form-group">
            <label for="email">Registered Email</label>
            <input type="email" id="email" required placeholder="name@example.com">
        </div>
        
        <div class="form-group">
            <label for="phone">WhatsApp / Contact Number</label>
            <input type="tel" id="phone" required placeholder="e.g. 98XXXXXXXX">
        </div>
        
        <div class="form-group">
            <label for="target_exam">Target Exam</label>
            <select id="target_exam" required>
                <option value="HP Patwari">HP Patwari</option>
                <option value="HP Police Constable">HP Police Constable</option>
                <option value="HP JOA IT">HP JOA IT</option>
                <option value="HPAS / Allied Services">HPAS / Allied Services</option>
                <option value="Other Regional HP Exams">Other Regional HP Exams</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="reason">Query / Reason for Free Access</label>
            <textarea id="reason" rows="3" required placeholder="Briefly describe your query or why you need free access..."></textarea>
        </div>
        
        <button type="submit" id="submitBtn" class="btn-submit">Submit Request 🚀</button>
        <div id="status-msg"></div>
    </form>

    <a href="https://hp-exam-pro.vercel.app" class="back-link">← Back to HP Exam Pro</a>
</div>

<script>
async function submitSupportQuery(event) {
    event.preventDefault();
    const btn = document.getElementById("submitBtn");
    const statusMsg = document.getElementById("status-msg");

    btn.innerText = "Sending Details...";
    btn.disabled = true;
    statusMsg.style.display = "none";
    statusMsg.className = "";

    const payload = {
        name: document.getElementById("name").value.trim(),
        email: document.getElementById("email").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        target_exam: document.getElementById("target_exam").value,
        reason: document.getElementById("reason").value.trim()
    };

    try {
        const response = await fetch("https://hp-exam-pro-dixk.onrender.com/api/support/claim-free-pro", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });

        if (response.ok) {
            statusMsg.className = "status-success";
            statusMsg.style.display = "block";
            statusMsg.innerText = "✅ Request sent successfully! Our team will contact you via WhatsApp / Email shortly.";
            document.getElementById("supportForm").reset();
        } else {
            throw new Error("API responded with an error");
        }
    } catch (err) {
        statusMsg.className = "status-error";
        statusMsg.style.display = "block";
        statusMsg.innerText = "❌ Submission failed. Please verify your connection or try again later.";
    } finally {
        btn.innerText = "Submit Request 🚀";
        btn.disabled = false;
    }
}
</script>

</body>
</html>
