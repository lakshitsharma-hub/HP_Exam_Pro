name: Send Daily Telegram Quiz

on:
  schedule:
    # रोज सुबह भारतीय समयानुसार (IST) लगभग 08:32 AM पर चलेगा (UTC 03:02 AM)
    - cron: '2 3 * * *'
  workflow_dispatch: # यह तुम्हें मैन्युअल रन करने का बटन देगा

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install requirements
      run: |
        python -m pip install --upgrade pip
        pip install -r telegram-quiz-bot/requirements.txt

    - name: Run Telegram Bot Script
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
        TELEGRAM_GROUP: ${{ secrets.TELEGRAM_GROUP }}
      run: |
        python telegram-quiz-bot/bot.py
        
